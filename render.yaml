services:
  - type: web
    name: wt-backend
    env: docker
    dockerfilePath: apps/backend/Dockerfile.prod
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: wt-database
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wt-redis
          property: connectionString
      - key: META_BASE_GRAPH_URL
        value: https://wt-mock-server.onrender.com
      - key: FRONTEND_URL
        value: https://wealthtransformersindia.vercel.app
      - key: JWT_ACCESS_TOKEN_TTL
        value: 3600
      - key: JWT_REFRESH_TOKEN_TTL
        value: 604800

  - type: keyvalue
    name: wt-redis
    region: singapore
    plan: free
    ipAllowList: []

databases:
  - name: wt-database
    databaseName: wt_whatsapp
    user: wt_app
    region: singapore
    plan: free
