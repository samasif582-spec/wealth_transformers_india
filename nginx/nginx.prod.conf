worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 2048;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  # Performance
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 110m;
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  # Rate limiting zones
  # Unauthenticated endpoints: 20 req/min per IP
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/m;
  # Authenticated API: 100 req/min per authenticated user (keyed on Authorization header)
  limit_req_zone $http_authorization zone=api_user_zone:20m rate=100r/m;

  upstream backend {
    server backend:3000;
    keepalive 32;
  }

  # HTTP → HTTPS redirect + ACME challenge
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS main server
  server {
    listen 443 ssl http2;
    server_name _;

    # TLS configuration
    ssl_certificate /etc/letsencrypt/live/api.wealthtrade.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wealthtrade.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.wealthtrade.in/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers (applied to ALL responses)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://sentry.io; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Auth endpoints — stricter rate limit (20 req/min per IP)
    location ~ ^/api/v1/auth/ {
      limit_req zone=auth_zone burst=5 nodelay;
      limit_req_status 429;
      add_header Retry-After 60 always;

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 30s;
    }

    # Meta webhook endpoint — fast response required (< 5s)
    location = /api/v1/webhooks/meta {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      # Raw body needed for HMAC verification
      proxy_request_buffering off;
      proxy_read_timeout 10s;
    }

    # Health check — no rate limit, no auth
    location = /api/v1/health {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      access_log off;
    }

    # All other API endpoints — 100 req/min per user
    location /api/ {
      limit_req zone=api_user_zone burst=20 nodelay;
      limit_req_status 429;
      add_header Retry-After 60 always;

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }

    # n8n — blocked from public internet (internal only)
    location /n8n/ {
      return 403;
    }

    # Block common attack paths
    location ~ /\. {
      deny all;
    }
  }
}
